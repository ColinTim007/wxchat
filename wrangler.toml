name = "wxchat"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# 静态资源配置 - 托管 Vite 构建产物
# SPA 路由回退到 index.html，由前端路由接管
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "wxchat"
database_id = "f81f19ed-7adb-431d-81ea-e8a914fd8134"

# KV 文件存储绑定
[[kv_namespaces]]
binding = "FILES"
id = "f7d94d4e3d5242e281276cbe198158a9"

# 环境变量配置（用于鉴权）
[vars]

# 会话过期时间（小时）
SESSION_EXPIRE_HOURS = "24"
# 最大登录尝试次数
MAX_LOGIN_ATTEMPTS = "5"
