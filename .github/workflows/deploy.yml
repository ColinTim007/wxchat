name: Check and deploy wxchat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      initialize_database:
        description: Initialize the existing D1 database tables (first deployment only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Upload and download regression tests
        run: node --experimental-strip-types worker/files.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Validate Worker bundle and bindings
        run: npx wrangler deploy --dry-run
      - name: Report production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wxchat-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate deployment secrets
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'ACCESS_PASSWORD', 'JWT_SECRET']) {
            if (!process.env[name]) throw new Error(`Missing GitHub repository secret: ${name}`)
          }
          if (process.env.JWT_SECRET.length < 32) throw new Error('JWT_SECRET must contain at least 32 characters')
          writeFileSync(`${process.env.RUNNER_TEMP}/wxchat-secrets.json`, JSON.stringify({
            ACCESS_PASSWORD: process.env.ACCESS_PASSWORD,
            JWT_SECRET: process.env.JWT_SECRET
          }), { mode: 0o600 })
          NODE
      - name: Initialize D1 tables
        if: inputs.initialize_database
        run: npx wrangler d1 execute wxchat --remote --file=database/schema.sql
      - run: npm run build
      - name: Publish Worker with authentication secrets
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/wxchat-secrets.json"
      - name: Remove temporary secrets
        if: always()
        run: node -e "require('node:fs').rmSync(process.env.RUNNER_TEMP + '/wxchat-secrets.json', { force:true })"
